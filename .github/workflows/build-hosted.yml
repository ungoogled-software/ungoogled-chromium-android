name: release build

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+.[0-9]+-[0-9]+']
  workflow_dispatch:
    inputs:
      architecture:
        description: 'architecture'
        required: true
        default: 'all'
        type: choice
        options: [all, arm64, arm]
      chromium_source:
        description: 'chromium source'
        required: true
        default: 'github'
        type: choice
        options: ['github', 'googlesource']
      release_name:
        description: 'release tag (blank = no release)'
        required: false
        default: ''
        type: string
      source_run_id:
        description: 'run id (blank = no resume)'
        required: false
        default: ''
        type: string
      threads:
        description: 'number of threads to use (0 = all)'
        required: false
        default: 0
        type: number

concurrency:
  group: build-hosted-${{ inputs.architecture || 'all' }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ (github.event_name == 'push' || inputs.architecture == 'all') && fromJSON('["arm64","arm"]') || fromJSON(format('["{0}"]', inputs.architecture)) }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-steps.yml
    secrets: inherit
    with:
      architecture: ${{ matrix.architecture }}
      chromium_source: ${{ inputs.chromium_source || 'github' }}
      source_run_id: ${{ inputs.source_run_id }}
      threads: ${{ fromJSON(inputs.threads || '0') }}

  release:
    needs: build
    if: ${{ (github.event_name == 'push' && github.ref_name || inputs.release_name) != '' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: rel
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.release_name }}
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find rel -name 'ChromePublic_*.apk' -o -name 'ChromePublic_arm64.aab' -o -name 'SystemWebView_*.apk')
          [ "${#files[@]}" -gt 0 ] || { echo "FATAL: no release files found"; exit 1; }
          for f in "${files[@]}"; do
              case "$f" in
                  *.apk) [ -f "${f}.idsig" ] || { echo "FATAL: $f is not release-signed, refusing to publish"; exit 1; } ;;
              esac
          done
          printf 'releasing %s with:\n' "$NAME"
          printf '  %s\n' "${files[@]}"
          gh release create "$NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$NAME" \
              --notes "Please see [CHANGELOG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md) for latest updates."

  fdroid:
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-arm64
          path: rel
      - name: Locate aapt2 (pre-installed Android SDK)
        shell: bash
        run: |
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          [ -n "$bt" ] || { echo "FATAL: no build-tools under $ANDROID_HOME"; exit 1; }
          echo "using aapt2 from $bt"; "$bt/aapt2" version
          echo "$bt" >> "$GITHUB_PATH"
      - name: Stage keystore from secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          [ -n "${KEYSTORE_B64:-}" ] || { echo "FATAL: KEYSTORE_B64 secret is not set"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ks"
          chmod 700 "$RUNNER_TEMP/ks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
          printf '%s' "$KEYSTORE_PASS" > "$RUNNER_TEMP/ks/pass"
          chmod 600 "$RUNNER_TEMP/ks"/*
      - name: Build F-Droid repo
        shell: bash
        run: |
          git lfs install
          export UGC_KEYSTORE="$RUNNER_TEMP/ks/release.jks"
          export UGC_KEYSTORE_PASSFILE="$RUNNER_TEMP/ks/pass"
          export UGC_APK="rel/ChromePublic_arm64.apk"
          export UGC_PACKAGE="org.ungoogled.chromium"
          export UGC_REPO_DIR="fdroid/repo"
          export UGC_KEEP="3"
          bash fdroid/build-repo.sh
      - name: Commit and push
        shell: bash
        env:
          NAME: ${{ (github.event_name == 'push' && github.ref_name) || inputs.release_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fdroid/ .gitattributes
          if git diff --cached --quiet; then
            echo "F-Droid repo unchanged; nothing to commit"
          else
            git commit -m "fdroid: publish $NAME"
            git push origin HEAD:master
          fi
      - name: Verify APK is served over raw (LFS fail-fast)
        shell: bash
        run: |
          latest=""; latestvc=0
          for f in fdroid/repo/org.ungoogled.chromium_*.apk; do
            [ -e "$f" ] || continue
            vc="$(basename "$f" | sed -E 's/.*_([0-9]+)\.apk/\1/')"
            if [ "$vc" -gt "$latestvc" ]; then latestvc="$vc"; latest="$f"; fi
          done
          [ -n "$latest" ] || { echo "FATAL: no published apk found"; exit 1; }
          name="$(basename "$latest")"
          expected="$(stat -c %s "$latest")"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/fdroid/repo/${name}"
          echo "verifying $raw (expected size $expected)"
          ok=""
          for i in 1 2 3 4 5 6; do
            cl="$(curl -fsSI "$raw" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="content-length"{print $2}')"
            if [ -n "$cl" ] && [ "$cl" = "$expected" ]; then ok=1; break; fi
            echo "  attempt $i: content-length=${cl:-?} (waiting)"; sleep 10
          done
          curl -fsSL -r 0-199 "$raw" -o "$RUNNER_TEMP/head.bin"
          if grep -qa "git-lfs.github.com/spec/v1" "$RUNNER_TEMP/head.bin"; then
            echo "FATAL: raw served an LFS pointer, not the APK"; exit 1
          fi
          [ -n "$ok" ] || { echo "FATAL: raw content-length never matched the APK size"; exit 1; }
          echo "OK: APK served over raw, LFS resolved"
      - name: Remove staged keystore
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/ks"
